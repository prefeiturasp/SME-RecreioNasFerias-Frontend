services:
  frontend:
    build:
      context: .
      target: dev
    container_name: sme-recreio-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      # Código do host → container (alterações refletem na hora)
      - .:/app
      # node_modules isolado no container (evita conflito Windows/Linux)
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true

  frontend-prod:
    profiles:
      - prod
    build:
      context: .
      target: production
    container_name: sme-recreio-frontend-prod
    ports:
      - "8080:80"

volumes:
  frontend_node_modules:
