services:
  frontend:
    build:
      context: .
      target: dev
    container_name: sme-recreio-frontend-dev
    ports:
      - '5173:5173'
    volumes:
      # Código do host → container (alterações refletem na hora)
      - .:/app
      # node_modules isolado no container (evita conflito Windows/Linux)
      - frontend_node_modules:/app/node_modules
    # Sincroniza dependências com o volume (evita node_modules desatualizado após mudar package.json)
    command: sh -c "sh docker/npm-ci-retry.sh && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    stdin_open: true
    tty: true

  frontend-prod:
    profiles:
      - prod
    build:
      context: .
      target: production
    container_name: sme-recreio-frontend-prod
    ports:
      - '8080:80'
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_SME_INTEGRACAO_API_BASE_URL: ${VITE_SME_INTEGRACAO_API_BASE_URL:-}
      VITE_SME_INTEGRACAO_API_KEY: ${VITE_SME_INTEGRACAO_API_KEY:-}

volumes:
  frontend_node_modules:
